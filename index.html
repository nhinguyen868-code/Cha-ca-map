<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bánh Mì Chả Cá Mập</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;font-family:Arial,sans-serif;overflow:hidden}
.wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px calc(32px + env(safe-area-inset-bottom));background:linear-gradient(transparent 58%,rgba(0,0,0,.72))}
.brand{color:#fff;font-weight:900;font-size:clamp(24px,7vw,38px);text-align:center;text-shadow:0 2px 10px #000;margin-bottom:10px}
.sub{color:#fff;font-size:15px;margin-bottom:14px;text-align:center}
.btn{display:block;width:min(92vw,390px);padding:16px 18px;border-radius:999px;background:#fff;color:#111;text-decoration:none;text-align:center;font-size:17px;font-weight:800;box-shadow:0 5px 24px rgba(0,0,0,.35)}
.count{color:#ddd;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <video id="intro" autoplay muted playsinline preload="auto">
    <source src="shark.MP4" type="video/mp4">
  </video>
  <div class="overlay">
    <div class="brand">BÁNH MÌ CHẢ CÁ MẬP 🦈</div>
    <div class="sub">Theo dõi tụi mình trên Facebook</div>
    <a class="btn" href="https://www.facebook.com/profile.php?id=61593044167479">VÀO FACEBOOK NGAY</a>
    <div class="count" id="count">Tự chuyển sau 6 giây…</div>
  </div>
</div>
<script>
const fb = 'https://www.facebook.com/profile.php?id=61593044167479';
let left = 6;
const count = document.getElementById('count');
const timer = setInterval(() => {
  left--;
  if (left <= 0) {
    clearInterval(timer);
    window.location.href = fb;
  } else {
    count.textContent = `Tự chuyển sau ${left} giây…`;
  }
}, 1000);
document.getElementById('intro').play().catch(()=>{});
</script>
</body>
</html>
