<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bánh Mì Chả Cá Mập</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;font-family:Arial,sans-serif;overflow:hidden}
.wrap{position:relative;width:100%;height:100%;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px calc(32px + env(safe-area-inset-bottom));background:linear-gradient(transparent 58%,rgba(0,0,0,.72));pointer-events:none}
.brand{color:#fff;font-weight:900;font-size:clamp(24px,7vw,38px);text-align:center;text-shadow:0 2px 10px #000;margin-bottom:10px}
.sub{color:#fff;font-size:15px;margin-bottom:14px;text-align:center}
.btn{display:block;width:min(92vw,390px);padding:16px 18px;border-radius:999px;background:#fff;color:#111;text-decoration:none;text-align:center;font-size:17px;font-weight:800;box-shadow:0 5px 24px rgba(0,0,0,.35);pointer-events:auto}
.count{color:#ddd;font-size:12px;margin-top:10px;min-height:16px}

.playGate{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.38);pointer-events:none}
.playGate.show{display:flex}
.playBox{text-align:center;pointer-events:auto}
.playBtn{border:0;border-radius:999px;padding:18px 28px;font-size:20px;font-weight:900;background:#fff;color:#111;box-shadow:0 8px 28px rgba(0,0,0,.4);cursor:pointer}
.playText{margin-top:12px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 8px #000}
.retry{margin-top:10px;color:#fff;font-size:13px;text-decoration:underline;cursor:pointer;display:none}
</style>
</head>
<body>
<div class="wrap">
  <video id="intro" autoplay muted playsinline webkit-playsinline preload="metadata">
    <source src="shark.mp4?v=4" type="video/mp4">
  </video>

  <div class="playGate" id="playGate">
    <div class="playBox">
      <button class="playBtn" id="playBtn" type="button">▶ CHẠM ĐỂ XEM 👀</button>
      <div class="playText" id="playText">Máy không tự chạy thì chạm thử nha 😆</div>
      <div class="retry" id="retry">Tải lại video</div>
    </div>
  </div>

  <div class="overlay">
    <div class="brand">BÁNH MÌ CHẢ CÁ MẬP 🦈</div>
    <div class="sub">Theo dõi tụi mình trên Facebook</div>
    <a class="btn" href="https://www.facebook.com/profile.php?id=61593044167479">VÀO FACEBOOK NGAY</a>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
const fb = 'https://www.facebook.com/profile.php?id=61593044167479';
const video = document.getElementById('intro');
const gate = document.getElementById('playGate');
const playBtn = document.getElementById('playBtn');
const playText = document.getElementById('playText');
const retry = document.getElementById('retry');
const count = document.getElementById('count');
let started = false;
let startWatch = null;
let redirectTimer = null;

function showGate(msg, showRetry=false){
  gate.classList.add('show');
  if (msg) playText.textContent = msg;
  retry.style.display = showRetry ? 'block' : 'none';
  playBtn.textContent = '▶ CHẠM ĐỂ XEM 👀';
  playBtn.disabled = false;
}
function hideGate(){ gate.classList.remove('show'); }

function markStarted(){
  if (video.currentTime <= 0.05) return;
  started = true;
  hideGate();
  video.controls = false;
  count.textContent = '';
  if (startWatch) clearTimeout(startWatch);
}

function watchPlayback(){
  if (startWatch) clearTimeout(startWatch);
  startWatch = setTimeout(() => {
    if (!started && video.currentTime <= 0.05) {
      video.controls = true;
      showGate('Chưa chạy được. Chạm lại hoặc bấm ▶ trên video nha.', true);
    }
  }, 3000);
}

function tryPlay(){
  video.muted = true;
  const p = video.play();
  if (p && typeof p.catch === 'function') {
    p.catch(() => {
      video.controls = true;
      showGate('Máy này không cho tự chạy. Chạm để xem nha 😆');
    });
  }
  watchPlayback();
}

video.addEventListener('timeupdate', markStarted);
video.addEventListener('playing', () => {
  // Không ẩn nút chỉ vì event playing; chờ currentTime thật sự nhích.
  watchPlayback();
});
video.addEventListener('loadeddata', () => {
  if (!started) tryPlay();
});
video.addEventListener('canplay', () => {
  if (!started) tryPlay();
});
video.addEventListener('stalled', () => {
  if (!started) showGate('Mạng đang tải clip hơi chậm. Chạm thử lại nha.', true);
});
video.addEventListener('error', () => {
  video.controls = true;
  showGate('Clip chưa tải được. Chạm “Tải lại video” nha.', true);
});

video.addEventListener('ended', () => {
  let left = 2;
  count.textContent = `Tự chuyển sau ${left} giây…`;
  redirectTimer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(redirectTimer);
      window.location.href = fb;
    } else {
      count.textContent = `Tự chuyển sau ${left} giây…`;
    }
  }, 1000);
});

playBtn.addEventListener('click', () => {
  // Không dùng await video.play() để tránh nút bị kẹt “ĐANG MỞ…”.
  hideGate();
  video.controls = true;
  tryPlay();
});

retry.addEventListener('click', () => {
  started = false;
  video.pause();
  video.currentTime = 0;
  video.load();
  hideGate();
  watchPlayback();
});

// Lần thử đầu tiên.
tryPlay();

// Nếu sau 1,5 giây vẫn chưa chạy, hiện nút nhưng không khóa video.
setTimeout(() => {
  if (!started && video.currentTime <= 0.05) {
    video.controls = true;
    showGate('Máy không tự chạy? Chạm đây để xem nha 😆');
  }
}, 1500);

// Quay lại tab Safari thì thử phát lại nếu clip chưa chạy.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !started) tryPlay();
});
</script>
</body>
</html>
